{% extends "base.html" %}
{% block title %}Sign in · Weigh-in Tracker{% endblock %}

{% block content %}
<h1>Sign in</h1>
<p class="caption">A speed bump, not real security — the network is what
  actually protects this. See deploy/DEPLOY.md.</p>
<form class="card" method="post">
  <div class="field">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" autofocus
           autocomplete="current-password">
  </div>
  <button class="primary" type="submit">Sign in</button>
</form>
{% endblock %}
